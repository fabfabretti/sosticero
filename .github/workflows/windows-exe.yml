name: Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        run: npm --prefix frontend ci; npm --prefix frontend run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Build exe
        shell: pwsh
        run: |
          $name = "Sosticero_" + (Get-Date -Format "yyyy-MM-dd")
          pyinstaller --noconfirm --onefile --name $name `
            --icon packaging/Sosticero.ico `
            --add-data "frontend/dist;frontend/dist" `
            --collect-submodules backend --collect-all uvicorn --collect-all tzdata --collect-all argon2 --collect-all _argon2_cffi_bindings `
            launcher.py
          "EXE_NAME=$name" >> $env:GITHUB_ENV

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/$env:EXE_NAME.exe" -PassThru
          try {
            $up = $false
            foreach ($try in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/ -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $up = $true; break }
              } catch {}
            }
            if (-not $up) { throw "App non raggiungibile su 127.0.0.1:8000" }
            $b = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/api/environment -TimeoutSec 3
            Write-Host "/api/environment -> $($b.StatusCode) $($b.Content)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/*.exe
